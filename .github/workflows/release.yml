name: Build release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86
            runner: windows-latest
            msystem: MINGW32
            gcc: mingw-w64-i686-gcc zip
            platform: windows
            exe: 7aba-windows.exe
            archive: 7aba-windows-x86.zip
          - name: windows-x64
            runner: windows-latest
            msystem: MINGW64
            gcc: mingw-w64-x86_64-gcc zip
            platform: windows
            exe: 7aba-windows-x64.exe
            archive: 7aba-windows-x64.zip
          - name: linux-x64
            runner: ubuntu-latest
            platform: linux
          - name: macos-native
            runner: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v4
      - name: Set up MinGW
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.gcc }}
      - name: Run regression suite
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: ./tests/run_all.ps1
      - name: Compile Windows interpreter
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          mkdir -p dist/package
          gcc -Wall -Wextra -Werror -O3 -std=c99 -static \
            -o dist/package/7aba.exe \
            main.c lexer.c parser.c eval.c bytecode.c diagnostic.c value.c \
            gc.c runtime.c stdlib.c ffi.c ast.c typecheck.c -lm
          ./dist/package/7aba.exe run releases/${{ matrix.name }}/hello.7ba
          cp releases/${{ matrix.name }}/README.txt releases/${{ matrix.name }}/hello.7ba LICENSE dist/package/
          (cd dist/package && zip -9 ../${{ matrix.archive }} 7aba.exe hello.7ba README.txt LICENSE)
          cp dist/package/7aba.exe dist/${{ matrix.exe }}
      - name: Compile Unix interpreter
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          CC=cc sh releases/unix-source/build.sh
          ./7aba run releases/unix-source/hello.7ba
          mkdir -p dist/package
          cp 7aba releases/unix-source/hello.7ba LICENSE dist/package/
          cp releases/unix-binary-README.txt dist/package/README.txt
          tar -czf "dist/7aba-${{ matrix.name }}-$(uname -m).tar.gz" -C dist/package .
          cp 7aba "dist/7aba-${{ matrix.name }}-$(uname -m)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Add source package and checksums
        run: |
          cp releases/7aba-source-unix.zip release-assets/
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "7aba-Lang $GITHUB_REF_NAME" \
              --generate-notes
          fi
